# Read by the shared `screenshots` runner in Repos/Scripts. Anything not set takes that script's
# defaults — device names, canvas size, and the wallpaper backdrop.

PROJECT="Gift Lists.xcodeproj"
SCHEME="Screenshots"
APP_BUNDLE_ID="com.jaydenirwin.holidaygiftslist"
MAC_APP_NAME="Gift Lists"
PLATFORMS="iphone ipad mac vision watch"
IPAD_ORIENTATION="portrait"

# What each shot shows, for the "Screenshots.md" the run writes beside them. Keyed by the UI test's
# capture name without its "NN-" prefix, so one line covers that screen on every platform that takes
# it — the watch walk shares "gifts" and "gift-details" with the others.
SHOT_DESCRIPTIONS="
  holidays      = The gift list filtered to the Holidays event: recipients expanded under the event
                  wallpaper, with its countdown
  birthday      = The gift list filtered to a Birthday event, its recipients expanded — with the gift
                  details alongside on the layouts where they do not cover the list
  gift-details  = One gift's details: what it is, who it is for, and where it was bought
  shopping      = The Shopping List tab, every gift still to buy across the events
  gifts         = The watch app's single list of gifts, which is what a watch user lands on
"

# The app's folder on the 256 Arts site. `--upload` refreshes the shots its page shows from
# the ones here, resized to the frame that page draws.
WEBSITE_SLUG="giftlists"

# The headline each shot is sold under on the website, written from the sentence in
# SHOT_DESCRIPTIONS that says what it shows. Keyed the same way, so a line follows its shot
# when the listing reorders.
SHOT_PROMOS="
  holidays     = Every gift filed under the occasion it is for.
  birthday     = Birthdays kept just as carefully.
  gift-details = What it is, who it is for, and where you found it.
  shopping     = One shopping list across every event at once.
"
